name: Build APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space for build and caches
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          # 🌟 关键修改：加上了 32 位和 64 位的 Android 编译目标
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install Android NDK
        run: |
          NDK_VERSION=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          MIN_SDK=$(sed -n 's/^minSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          NDK_BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/aarch64-linux-android$MIN_SDK-clang"
          test -x "$NDK_BIN/llvm-strip"

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Build Release (Unsigned)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./x build --release

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist/apk
          for flavor in standard legacy; do
            apk="app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            if [ -f "$apk" ]; then
              cp -v "$apk" dist/apk/
            fi
          done
          echo "Collected APKs:"
          ls -1 dist/apk

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: wekit-apk
          path: dist/apk/*.apk
